[package]
name = "my_wry"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
percent-encoding = "2"
pyo3 = { version = "0.28.3", features = ["abi3-py39", "extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
wry = "0.57.0"
